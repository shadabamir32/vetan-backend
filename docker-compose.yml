services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - db-data:/data
    env_file:
      - .env
    environment:
      - DB_DATABASE=/data/salaryapp.db
    restart: always

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
        - VITE_API_KEY=${VITE_API_KEY}
        - VITE_TENANT_NAME=${VITE_TENANT_NAME}
    depends_on:
      - backend
    restart: always

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  caddy_data:
  caddy_config:
