<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2d4a"/>
      <stop offset="100%" style="stop-color:#0f1c33"/>
    </linearGradient>
    <linearGradient id="rupee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle coin ring -->
  <circle cx="32" cy="30" r="20" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
  <circle cx="32" cy="30" r="17" fill="none" stroke="#10b981" stroke-width="0.4" opacity="0.15"/>

  <!-- Rupee symbol ₹ drawn as paths -->
  <!-- Top horizontal bar -->
  <line x1="22" y1="17" x2="40" y2="17" stroke="url(#rupee)" stroke-width="3" stroke-linecap="round"/>
  <!-- Second horizontal bar -->
  <line x1="22" y1="23" x2="40" y2="23" stroke="url(#rupee)" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertical left stroke -->
  <line x1="26" y1="17" x2="26" y2="44" stroke="url(#rupee)" stroke-width="3" stroke-linecap="round"/>
  <!-- Arc top of P -->
  <path d="M26 17 Q40 17 40 23 Q40 29 26 29" fill="none" stroke="url(#rupee)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal slash line -->
  <line x1="26" y1="29" x2="40" y2="44" stroke="url(#rupee)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Small gold bar chart at the bottom -->
  <rect x="17" y="51" width="4" height="5" rx="1" fill="url(#gold)" opacity="0.7"/>
  <rect x="23" y="48" width="4" height="8" rx="1" fill="url(#gold)" opacity="0.85"/>
  <rect x="29" y="45" width="4" height="11" rx="1" fill="url(#gold)"/>
  <rect x="35" y="47" width="4" height="9" rx="1" fill="url(#gold)" opacity="0.85"/>
  <rect x="41" y="50" width="4" height="6" rx="1" fill="url(#gold)" opacity="0.7"/>
</svg>